[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackify"
version = "0.1.0"
description = "A powerful tool for tracking time spent on GitHub pull requests and branches"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Pedro Gonzalez", email = "pedroifgonzalez@gmail.com"},
]
maintainers = [
    {name = "Pedro Gonzalez", email = "pedroifgonzalez@gmail.com"},
]
keywords = [
    "github",
    "time-tracking",
    "wakatime",
    "clockify",
    "pull-request",
    "productivity",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic-settings>=2.11.0",
    "pygithub>=2.8.1",
    "requests>=2.32.0",
    "rich>=14.2.0",
    "slack-sdk>=3.37.0",
    "typer>=0.19.2",
]

[project.urls]
Homepage = "https://github.com/pedroifgonzalez/trackify"
Documentation = "https://github.com/pedroifgonzalez/trackify#readme"
Repository = "https://github.com/pedroifgonzalez/trackify.git"
Issues = "https://github.com/pedroifgonzalez/trackify/issues"
Changelog = "https://github.com/pedroifgonzalez/trackify/blob/main/CHANGELOG.md"

[project.scripts]
trackify = "src.main:app"

[dependency-groups]
dev = [
    "black>=25.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-vcr>=1.0.2",
    "mypy>=1.9.0",
    "bandit>=1.7.7",
    "types-requests>=2.32.4.20250913",
    "pytest-coverage>=0.0",
    "freezegun>=1.5.5",
    "build>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
