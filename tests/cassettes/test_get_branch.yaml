        Iv\xE1n Fern\xE1ndez Gonz\xE1lez\",\"email\":\"pedroifgonzalez@gmail.com\",\"date\":\"2025-10-09T20:22:42Z\"},\"message\":\"feat(github):
        Implement SOLID-based GitHub client with PR reporting\\n\\n- Refactor GitHub
        client to follow SOLID principles:\\n  - Add IGitClient interface for better
        dependency inversion\\n  - Create DTOs for data transfer (CommitData, PullRequestData)\\n
        \ - Implement FluentBase for method chaining\\n\\n- Add PR commit retrieval
        functionality:\\n  - Implement get_pull_commits method to fetch commit history\\n
        \ - Add proper error handling and type annotations\\n\\n- Create PR reporting
        system:\\n  - Add PullRequestReport generator for rich PR summaries\\n  -
        Implement commit categorization by conventional commit types\\n  - Generate
        Markdown reports with commit statistics and summaries\\n\\n- Improve test
        coverage:\\n  - Add tests for commit retrieval\\n  - Add tests for PR report
        generation\\n\\nThis refactoring improves maintainability, adds new functionality
