        commit: Set up Trackify time tracking integration\\n\\nThis commit establishes
        the foundation for the Trackify project, which integrates with time tracking
        services:\\n\\n- Set up basic project structure with Python 3.13 support\\n-
        Implement Clockify API client with time entry creation functionality\\n- Implement
        WakaTime API client for retrieving time durations\\n- Add utility functions
        for time formatting\\n- Configure testing environment with pytest and VCR
        for API mocking\\n- Add environment variable configuration for API keys and
        credentials\\n\\nThe project allows tracking time spent on branches and creating
        corresponding entries in Clockify.\",\"tree\":{\"sha\":\"2de9b9dbded223d5c695692249e715fa45482d38\",\"url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/git/trees/2de9b9dbded223d5c695692249e715fa45482d38\"},\"url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/git/commits/16a90c8cb1492d3f35365900e4ac71bbb2b0bb67\",\"comment_count\":0,\"verification\":{\"verified\":false,\"reason\":\"unsigned\",\"signature\":null,\"payload\":null,\"verified_at\":null}},\"url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/commits/16a90c8cb1492d3f35365900e4ac71bbb2b0bb67\",\"html_url\":\"https://github.com/pedroifgonzalez/trackify/commit/16a90c8cb1492d3f35365900e4ac71bbb2b0bb67\",\"comments_url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/commits/16a90c8cb1492d3f35365900e4ac71bbb2b0bb67/comments\",\"author\":null,\"committer\":null,\"parents\":[]}]"
