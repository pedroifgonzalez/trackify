        Iv\xE1n Fern\xE1ndez Gonz\xE1lez\",\"email\":\"pedroifgonzalez@gmail.com\",\"date\":\"2025-10-12T21:06:32Z\"},\"committer\":{\"name\":\"Pedro
        Iv\xE1n Fern\xE1ndez Gonz\xE1lez\",\"email\":\"pedroifgonzalez@gmail.com\",\"date\":\"2025-10-12T21:06:32Z\"},\"message\":\"feat:
        implement fluent API with stage method and custom exception hierarchy\\n\\nMajor
        refactoring to improve code readability, error handling, and developer experience:\\n\\n##
        Core Changes\\n\\n### Fluent API Enhancement\\n- Add stage method to FluentBase
        for cleaner orchestration chains\\n- Support both lambda and string method
        name invocations\\n- Integrate console.status spinners directly into fluent
        chain\\n- Add TypeVar support for proper type inference in method chaining\\n\\n###
        Custom Exception Hierarchy\\n- Create `TrackifyError` base exception with
        domain-specific subclasses:\\n  - `ConfigError` for configuration issues\\n
        \ - `ClientError` for API client failures\\n  - `OrchestratorError` for orchestration
        failures\\n  - `ValidationError` for input validation errors\\n- Add `@handle_errors`
        decorator for consistent CLI error handling\\n- Replace generic exceptions
        with custom ones across codebase\\n\\n### Orchestrator Improvements\\n- Add
        `beautify_context()` method to format time data\\n- Move time formatting logic
        from CLI to orchestrator\\n- Use `OrchestratorError` instead of generic ValueError/RuntimeError\\n-
        Improve graceful handling of missing time data\\n\\n### CLI Enhancements\\n-
        Simplify command implementations using stage method\\n- Remove repetitive
        try/except blocks with `@handle_errors` decorator\\n- Return orchestrator
        context from commands for testability\\n- Add centered success messages\\n\\n###
        Client Updates\\n- Replace ValueError with ClientError in ClockifyClient\\n-
        Remove debug print statements\\n- Improve error messages with proper exception
        types\\n\\n### Testing Infrastructure\\n- Update conftest.py to load from
        `.env.test`\\n- Add `.env.test` to .gitignore\\n- Improve test configuration
        loading with Pydantic Settings\\n\\n## Breaking Changes\\n- Commands now return
        dict instead of None\\n- Date parameter validation moved to decorator (removed
        from function body)\\n\\n## Example Usage\\n```python\\norchestrator = (\\n
        \   Orchestrator()\\n    .stage(\\\"Setting code tracker\\\", \\\"with_code_tracker\\\",
        client)\\n    .stage(\\\"Fetching PR\\\", \\\"get_pull\\\", pr_id)\\n    .stage(\\\"Computing
        time\\\", \\\"compute_time\\\", search_date=date)\\n    .stage(\\\"Generating
        summary\\\", \\\"add_summary\\\")\\n)\",\"tree\":{\"sha\":\"5b70500ae9d7a790d464e98c1e16b79ab7b7a59c\",\"url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/git/trees/5b70500ae9d7a790d464e98c1e16b79ab7b7a59c\"},\"url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/git/commits/d9b8e3459ed1419d2176e74e89ffcf42a987ef27\",\"comment_count\":0,\"verification\":{\"verified\":false,\"reason\":\"unsigned\",\"signature\":null,\"payload\":null,\"verified_at\":null}},\"url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/commits/d9b8e3459ed1419d2176e74e89ffcf42a987ef27\",\"html_url\":\"https://github.com/pedroifgonzalez/trackify/commit/d9b8e3459ed1419d2176e74e89ffcf42a987ef27\",\"comments_url\":\"https://api.github.com/repos/pedroifgonzalez/trackify/commits/d9b8e3459ed1419d2176e74e89ffcf42a987ef27/comments\",\"author\":{\"login\":\"pedroifgonzalez\",\"id\":55602011,\"node_id\":\"MDQ6VXNlcjU1NjAyMDEx\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/55602011?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/pedroifgonzalez\",\"html_url\":\"https://github.com/pedroifgonzalez\",\"followers_url\":\"https://api.github.com/users/pedroifgonzalez/followers\",\"following_url\":\"https://api.github.com/users/pedroifgonzalez/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/pedroifgonzalez/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/pedroifgonzalez/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/pedroifgonzalez/subscriptions\",\"organizations_url\":\"https://api.github.com/users/pedroifgonzalez/orgs\",\"repos_url\":\"https://api.github.com/users/pedroifgonzalez/repos\",\"events_url\":\"https://api.github.com/users/pedroifgonzalez/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/pedroifgonzalez/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"committer\":{\"login\":\"pedroifgonzalez\",\"id\":55