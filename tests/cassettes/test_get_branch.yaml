        project structure and implement core functionality for Trackify\\n\\nThis
        commit:\\n- Creates initial project structure with modular architecture\\n-
        Implements interfaces for code trackers, activity trackers, and time managers\\n-
        Adds GitHub client for PR and commit tracking\\n- Adds WakaTime client for
        activity tracking\\n- Adds Clockify client for time logging\\n- Implements
